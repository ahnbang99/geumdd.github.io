<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 아이폰 사파리 뷰포트 및 노치 영역 최적화 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 홈 화면 추가(PWA) 모드 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OTT Tracker">
  <title>OTT 시청 절제 캘린더</title>
  
  <style>
    :root {
      /* iOS 순정 다크모드 컬러 팔레트 (푸른기 완전 제거) */
      --bg-color: #000000;            /* OLED 트루블랙 */
      --card-bg: #1c1c1e;            /* iOS System Grouped Background / Secondary */
      --card-border: #2c2c2e;        /* iOS Fill / Separator */
      --accent-color: #ff453a;       /* iOS System Red (OTT 시청 표시) */
      --text-main: #ffffff;          /* iOS Label */
      --text-muted: #8e8e93;         /* iOS Secondary Label */
      --success-color: #64d2ff;      /* iOS System Cyan (성공 메세지) */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .header h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.1rem;
      padding: 8px 12px;
      cursor: pointer;
      opacity: 0.8;
    }

    .nav-btn:active {
      opacity: 0.4;
    }

    /* 캘린더 그리드 및 틀 고정 */
    .calendar {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    /* 6주 고정 그리드 (6행 고정) */
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.95rem;
      font-weight: 400;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* 달력 고정을 위한 빈 셀 */
    .day.empty {
      cursor: default;
      pointer-events: none;
    }

    .day.today {
      background-color: var(--card-border);
      font-weight: 600;
    }

    /* OTT 시청한 날 */
    .day.watched {
      background-color: var(--accent-color);
      color: #ffffff;
      font-weight: 700;
    }

    .info-box {
      margin-top: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
    }

    .streak-highlight {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--success-color);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .info-box p {
      margin: 4px 0;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .info-box span.count {
      color: var(--accent-color);
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <button class="nav-btn" id="prevMonth">&#10094;</button>
    <h2 id="monthTitle"></h2>
    <button class="nav-btn" id="nextMonth">&#10095;</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="days" id="calendarDays"></div>
  </div>

  <div class="info-box">
    <div class="streak-highlight" id="streakText">기록을 불러오는 중...</div>
    <p>이번 달 OTT 시청 횟수: <span class="count" id="monthCount">0</span>회</p>
    <p style="font-size: 0.75rem; margin-top: 8px; opacity: 0.8;">💡 날짜 터치 시 시청 기록 토글 가능</p>
  </div>
</div>

<script>
  let currentDate = new Date();
  let watchedDates = JSON.parse(localStorage.getItem('ott_watched_dates')) || [];

  const monthTitle = document.getElementById('monthTitle');
  const calendarDays = document.getElementById('calendarDays');
  const monthCount = document.getElementById('monthCount');
  const streakText = document.getElementById('streakText');

  function updateStreakInfo() {
    if (watchedDates.length === 0) {
      streakText.innerText = "📺 아직 시청 기록이 없습니다.";
      return;
    }

    const sortedDates = [...watchedDates].sort();
    const today = new Date();
    const todayZero = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    const pastOrTodayWatched = sortedDates.filter(d => new Date(d) <= todayZero);

    if (pastOrTodayWatched.length === 0) {
      streakText.innerText = "📺 최근 시청 기록이 없습니다.";
      return;
    }

    const lastWatchedStr = pastOrTodayWatched[pastOrTodayWatched.length - 1];
    const [year, month, day] = lastWatchedStr.split('-').map(Number);
    const lastWatchedDate = new Date(year, month - 1, day);

    const diffTime = todayZero - lastWatchedDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays === 0) {
      streakText.innerHTML = "⚠️ <span style='color: var(--accent-color);'>오늘</span> OTT를 시청했습니다.";
    } else if (diffDays === 1) {
      streakText.innerText = "⏳ 마지막 시청 후 1일 지났습니다.";
    } else {
      streakText.innerText = `🎉 마지막 시청 후 ${diffDays}일째 안 보는 중!`;
    }
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthTitle.innerText = `${year}년 ${month + 1}월`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    calendarDays.innerHTML = '';

    const TOTAL_CELLS = 42; // 6주 x 7일 = 42개 셀로 완전히 고정
    let currentMonthWatchedCount = 0;
    const today = new Date();

    for (let i = 0; i < TOTAL_CELLS; i++) {
      const dayDiv = document.createElement('div');
      dayDiv.classList.add('day');

      // 달력 시작 전 빈 셀
      if (i < firstDayIndex) {
        dayDiv.classList.add('empty');
      } 
      // 해당 월의 날짜 셀
      else if (i < firstDayIndex + lastDate) {
        const day = i - firstDayIndex + 1;
        dayDiv.innerText = day;

        const formattedMonth = String(month + 1).padStart(2, '0');
        const formattedDay = String(day).padStart(2, '0');
        const dateString = `${year}-${formattedMonth}-${formattedDay}`;

        if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
          dayDiv.classList.add('today');
        }

        if (watchedDates.includes(dateString)) {
          dayDiv.classList.add('watched');
          currentMonthWatchedCount++;
        }

        dayDiv.addEventListener('click', () => {
          if (watchedDates.includes(dateString)) {
            watchedDates = watchedDates.filter(d => d !== dateString);
          } else {
            watchedDates.push(dateString);
          }
          localStorage.setItem('ott_watched_dates', JSON.stringify(watchedDates));
          renderCalendar();
        });
      } 
      // 해당 월 끝난 후 남아있는 빈 셀 (고정 틀 유지)
      else {
        dayDiv.classList.add('empty');
      }

      calendarDays.appendChild(dayDiv);
    }

    monthCount.innerText = currentMonthWatchedCount;
    updateStreakInfo();
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  renderCalendar();
</script>

</body>
</html>
